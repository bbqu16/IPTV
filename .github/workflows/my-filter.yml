name: 'My Filter 个人订阅'
on:
  schedule:
    # 北京时间每天 04:35 自动运行（上游"Live Update"每天 04:00 更新完直播源之后）
    - cron: '35 20 * * *'
  workflow_dispatch:  # 支持在网页上手动点击运行

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行筛选脚本
        run: python filter.py

      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add my.m3u my.txt
          if git diff --cached --name-only | grep -q .; then
            git commit -m "My Filter: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') (CST)"
            git push origin HEAD:$GITHUB_REF_NAME
            echo "✅ 个人订阅已更新"
          else
            echo "ℹ️ 无文件变更，跳过提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
